# Angular 22 build and deployment

trigger:
  - master

pool:
  vmImage: "ubuntu-latest"

steps:
  - task: UseNode@1
    inputs:
      version: "22.22.3"
    displayName: "Use Node.js 22.22.3"

  - script: npm ci
    displayName: "Install dependencies"

  - script: npm run lint
    displayName: "Lint"

  - script: npm test -- --watch=false
    displayName: "Test"

  - script: npm run build -- --configuration production
    displayName: "Build Angular 22"

  - script: |
      tar -czf torneio.tar.gz -C '$(System.DefaultWorkingDirectory)/dist/torneio-l4d2' .
    displayName: "Compress files"

  - task: CopyFilesOverSSH@0
    inputs:
      sshEndpoint: "L4D2 - Resources"
      sourceFolder: "$(Build.Repository.LocalPath)"
      contents: "*.tar.gz"
      targetFolder: "/home/devops"
      cleanTargetFolder: true
      overwrite: true
      failOnEmptySource: true
    displayName: "Copy Build Artifacts via SSH"

  - task: SSH@0
    inputs:
      sshEndpoint: "L4D2 - Resources"
      readyTimeout: "20000"
      commands: |
        rm -rf /home/torneio/*
        tar -xzf /home/devops/torneio.tar.gz -C /home/torneio
        rm /home/devops/*.tar.gz
