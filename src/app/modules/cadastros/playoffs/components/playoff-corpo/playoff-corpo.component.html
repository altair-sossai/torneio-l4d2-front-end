<div class="corpo">
  <app-playoff-header [timeA]="playoff.timeA" [timeB]="playoff.timeB" [confronto]="confronto">
  </app-playoff-header>
  <nz-divider></nz-divider>
  @if (playoff.timeA && playoff.timeB) {
    <app-playoff-resumo [playoff]="playoff"
    [confronto]="confronto"></app-playoff-resumo>
  }
</div>
