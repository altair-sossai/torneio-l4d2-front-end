@if (time) {
  <div class="time">
    <h3>{{time.nome}}</h3>
    @for (jogador of time.jogadores; track jogador) {
      <p nz-popover nzPopoverTitle="Dados do jogador"
        [nzPopoverContent]="contentTemplate">
        {{jogador.nome}}
        <ng-template #contentTemplate>
          <app-jogador [jogador]="jogador" [podeExcluir]="false" [podeAtualizar]="false"></app-jogador>
        </ng-template>
      </p>
    }
    @if (playoff.status !== StatusPlayoff.Aguardando) {
      <nz-tag [nzColor]="color">
        <i nz-icon [nzType]="icon"></i>
        <span>{{text}}</span>
      </nz-tag>
    }
  </div>
}
@if (!time) {
  <div class="empty">
    <h3>(A definir)</h3>
  </div>
}
