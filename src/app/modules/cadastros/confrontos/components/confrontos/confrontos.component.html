<div class="buttons">
  <button nz-button nzType="default" (click)="limparCampanhas()">
    <i nz-icon nzType="clear" nzTheme="outline"></i>
    Limpar campanhas
  </button>

  <button nz-button nzType="primary" (click)="sortearCampanhas()">
    <i nz-icon nzType="sync" nzTheme="outline"></i>
    Sortear campanhas
  </button>
</div>

@if (!busy) {
  <nz-tabs [nzSelectedIndex]="rodadaAtual" (nzSelectedIndexChange)="rodadaAtual = $event">
    @for (rodada of rodadas; track rodada) {
      <nz-tab nzTitle="{{ rodada.rodada + 'ª Rodada' }}">
        @for (confronto of rodada.confrontos; track confronto) {
          <app-confronto [confronto]="confronto" [podeEditar]="podeEditar" (atualizado)="pesquisar()"></app-confronto>
        }
      </nz-tab>
    }
  </nz-tabs>
}

@if (busy) {
  <nz-skeleton [nzActive]="true"></nz-skeleton>
}
